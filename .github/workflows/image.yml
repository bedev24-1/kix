# Construire l'image ailleurs que sur le VPS.
#
# `next build` demande environ un gigaoctet et demi. Le VPS héberge déjà
# Supabase, le serveur média et l'application : le noyau tuait la compilation.
# GitHub la fait à sa place, publie l'image, et le VPS n'a plus qu'à la tirer.
name: Image de production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: noms
        # ghcr.io n'accepte que des minuscules ; un dépôt nommé « Kix »
        # ferait échouer la publication sur une erreur peu parlante.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.noms.outputs.image }}:main
            ${{ steps.noms.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ce qui doit exister à la construction. Rien de secret ici : les
          # « NEXT_PUBLIC_* » partent dans le navigateur de chaque visiteur,
          # et l'adresse du stockage figure déjà dans chaque image
          # téléversée. Ce sont donc des *variables* de dépôt, pas des
          # secrets.
          build-args: |
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
